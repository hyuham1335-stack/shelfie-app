# TRD 9번 CI/CD 파이프라인의 실물.
#
# 게이트 다섯 줄은 TRD 8번 "AC 검증 커맨드"와 같은 세트다 — typecheck · lint ·
# test · build · audit. 하나라도 실패하면 배포가 막힌다.
#
# 골든 인식률 테스트(`npm run test:golden`)는 **여기 넣지 않는다.** 실제
# Anthropic·알라딘 API를 호출하므로 CI에서 돌면 비용이 들고, 키가 없으면
# 목업 위에서 재현율 100%를 찍어 게이트가 정반대로 작동한다 (ADR-010).
# 그것은 제한 배포 전에 사람이 한 번 돌리는 명령이다 (TRD 9번 수동 체크리스트).
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# 같은 브랜치에 push가 이어지면 앞의 런을 취소한다. 게이트의 답은 최신 커밋에
# 대한 것만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vercel 서버리스 런타임과 같은 메이저를 쓴다 (TRD 2번 · ADR-005).
          node-version: "20"
          cache: npm

      - name: install
        run: npm ci

      # 아래 다섯 줄이 한 세트다 (TRD 8번). 순서는 싼 게이트부터 —
      # 타입이 깨진 코드를 빌드까지 끌고 가서 알아낼 이유가 없다.
      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        # 키가 없어도 빌드는 통과해야 한다. services/ 가 목업으로 떨어지는 것이
        # TRD 9번 목업 모드의 전제다 — 여기서 키를 요구하면 그 전제가 깨진다.
        run: npm run build

      - name: audit
        # 6.5·9번의 의존성 취약점 게이트. high 이상이면 배포를 막는다.
        run: npm run audit

      - name: upload test report
        # 실패해도 리포트는 남긴다 — 무엇이 깨졌는지 보려고 다시 돌리지 않게.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit/
          if-no-files-found: warn
